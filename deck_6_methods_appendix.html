<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Deck 6: Methods & Appendix</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f5f5f5;padding:20px}.container{max-width:1200px;margin:0 auto;background:white;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1);overflow:hidden}.header{background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);color:white;padding:20px;display:flex;justify-content:space-between}.header h1{font-size:24px}.slide-container{padding:60px;min-height:600px;display:flex;flex-direction:column}.slide-title{font-size:36px;font-weight:700;color:#1e3c72;margin-bottom:30px}.slide-body{font-size:16px;line-height:1.7;color:#333;margin-bottom:40px;flex-grow:1}.slide-body p{margin-bottom:16px}.slide-body ul{margin-left:20px;margin-bottom:16px}.slide-body li{margin-bottom:10px}.slide-body strong{font-weight:600;color:#1e3c72}.speaker-notes{display:none;background:#f9f9f9;border-top:1px solid #e0e0e0;padding:20px;font-size:14px;color:#666;max-height:300px;overflow-y:auto}.speaker-notes.visible{display:block}.speaker-notes h4{color:#1e3c72;margin-bottom:10px}.navigation{display:flex;justify-content:space-between;align-items:center;padding:20px 60px;background:#fafafa;border-top:1px solid #e0e0e0}.nav-button{background:#1e3c72;color:white;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;font-size:14px}.nav-button:hover:not(:disabled){background:#2a5298}.nav-button:disabled{background:#ccc;opacity:0.6}.progress-bar{width:200px;height:4px;background:#e0e0e0;border-radius:2px;margin:10px auto}.progress-fill{height:100%;background:#2a5298}.callout{background:#e8f4f8;border-left:4px solid #2a5298;padding:16px;margin:20px 0}.callout p{margin:0;color:#1e3c72}button{background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.4);padding:8px 16px;border-radius:4px;cursor:pointer;font-size:14px}button:hover{background:rgba(255,255,255,0.3)}button.active{background:rgba(255,255,255,0.4)}</style></head><body><div class="container"><div class="header"><h1>Deck 6: Methods & Appendix</h1><div><button id="toggleNotes" class="active">👁 Notes</button><span style="color:#ccc;font-size:14px;margin-left:10px"><span id="slideNumber">1</span>/<span id="totalSlides">22</span></span></div></div><div id="slidesContainer"></div><div class="navigation"><button class="nav-button" id="prevBtn" onclick="previousSlide()">← Previous</button><div style="text-align:center;font-size:14px;color:#666"><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:4.5%"></div></div><div id="progressText">Slide 1 of 22</div></div><button class="nav-button" id="nextBtn" onclick="nextSlide()">Next →</button></div></div><script>const slides=[{title:"Deck 6: Methods & Appendix",body:"<p style='font-size:20px;color:#666;margin-top:60px;'>Sections 13–14: Methodological transparency and reference materials that ground the entire 6-deck suite in data sources, limitations, and definitions.</p>",notes:"Deck 6 provides the epistemic foundation for the report. It explains how data were collected, what definitions were used, and what limitations apply. This is critical for users to understand the confidence level and scope of claims throughout Decks 1-5. It also includes appendix materials (tables, extended definitions, category matrices) for users who want to dive deeper."},{title:"Section 13: Methods",body:"",notes:""},{title:"13.1 Data Sources and Collection",body:"<p><strong>Funding data:</strong> Primary source is New Market Pitch's longevity funding analysis (July 2025–June 2026). This dataset includes disclosed equity rounds meeting strict pure-play definition (companies explicitly targeting healthspan, aging biology, or long-term health optimization). Non-disclosed deals and private investments are not captured.</p><p><strong>Market forecasts:</strong> Secondary sources include MarketIntelo market-research reports for longevity biotech drug market and drug-discovery platforms. These are third-party analyses, not primary data collection.</p><p><strong>Wellness economy data:</strong> Global Wellness Institute reports on global wellness economy size and growth rates (2024 baseline, 2029 projections).</p><p><strong>Geographic and category breakdown:</strong> Derived from New Market Pitch dataset by geographic location and company category (therapeutics, platforms, clinics, consumer, diagnostics).</p>",notes:"These are secondary sources, not primary data collection. The report synthesizes existing market research rather than commissioning new studies. This is appropriate for a market snapshot but has limitations (see 13.3)."},{title:"13.2 Definitions and Scope Decisions",body:"<p><strong>Pure-play longevity definition:</strong> Companies whose core activity is explicitly targeting healthspan, aging biology, or long-term health optimization. This excludes pharmaceutical companies where aging is one indication among many, general wellness platforms, and eldercare services not anchored in aging biology.</p><p><strong>Nine-category taxonomy:</strong> Defined in Section 2 and applied consistently throughout. Categories are mechanistically distinct and represent different capital intensity, timelines, and integration requirements.</p><p><strong>Underserved populations:</strong> Defined in Section 2.5 as individuals and communities facing structural barriers to accessing timely, high-quality, culturally relevant health services. This includes rural, low-income, fragile/conflict-affected, and stigmatized populations.</p><p><strong>Integration:</strong> Defined as alignment with primary care and community mental health systems—the current backbone of health service delivery. Not integration with specialist clinics or premium services.</p>",notes:"These definitions are functional and decision-oriented, not purely academic. They're designed to enable consistent analysis across the report and to highlight the equity lens."},{title:"13.3 Limitations and Caveats",body:"<p><strong>Funding data limitations:</strong></p><ul><li><strong>Non-disclosed deals not captured:</strong> Some funding (especially large Series C+ rounds) is announced but not detailed. The July 2025–June 2026 sample captures declared rounds only.</li><li><strong>Private capital not included:</strong> Family offices, corporate venture capital, and other non-VC sources are not systematically tracked.</li><li><strong>Geographic bias:</strong> Data heavily reflects North American and Europe-focused companies. APAC, LMIC, and African startups may be undercounted.</li><li><strong>Snapshot vs. trend:</strong> A 12-month window captures current flows but not long-term trajectory. The market is evolving; 2027 may look different.</li></ul><p><strong>Market forecast limitations:</strong></p><ul><li><strong>Conditional on regulatory approval:</strong> $101.6B longevity biotech drug market assumes multiple approvals for aging-targeted drugs. If regulatory pathways remain unclear, actual market will be smaller.</li><li><strong>Third-party estimates:</strong> MarketIntelo and similar firms make assumptions about adoption, pricing, and indication breadth. These may not materialize.</li></ul>",notes:"Being explicit about limitations is critical for credibility. Users should understand what confidence to assign to different claims. Funding data is solid (based on disclosed deals). Market forecasts are speculative."},{title:"13.4 Underserved Populations: Specific Caveats",body:"<p><strong>Data gaps in underserved-population analysis:</strong></p><ul><li><strong>Limited primary research:</strong> The report synthesizes existing research on underserved populations and health systems. New primary data collection in rural, LMIC, and fragile settings was not conducted.</li><li><strong>Heterogeneity:</strong> 'Underserved populations' is a broad category. Needs and contexts vary dramatically between rural USA, urban India, and fragile states. Claims should be understood as directional, not universally applicable.</li><li><strong>Feasibility assumptions:</strong> Statements about 'plausible pathways for 2030' are educated estimates based on current trends, not forecasts. Policy change, breakthrough science, or economic shocks could shift timelines.</li><li><strong>Evidence from high-income settings:</strong> Most clinical trials and outcomes data come from high-income countries. Application to other settings requires adaptation research.</li></ul>",notes:"The underserved-population lens is central to this report but also the most data-light. Users should understand this is a scaffolding for thinking about equity, not a comprehensive analysis of what will actually happen in every setting."},{title:"13.5 Research Ethics and Transparency",body:"<p><strong>Approach to conflicts and bias:</strong></p><ul><li>Report is independent analysis, not sponsored by longevity companies, investors, or health systems.</li><li>Sources are publicly available (funding databases, published research, market reports).</li><li>Viewpoint is systems-oriented, highlighting both opportunities and risks in current capital allocation.</li></ul><p><strong>Engagement with stakeholders:</strong></p><ul><li>Input from investors, founders, health-system leaders, and community representatives informs framing and emphasis throughout.</li><li>Report is designed to be useful to multiple audiences: founders (strategic guidance), investors (due-diligence framework), systems leaders (equity lens), and policy-makers (intervention points).</li></ul>",notes:"Transparency about method and perspective is important for credibility. The report takes a clear position (integration and equity matter) but grounds it in data and systems analysis, not ideology."},{title:"Section 14: Appendix",body:"",notes:""},{title:"14.1 Nine-Category Taxonomy Quick Reference",body:"<p><strong>Therapeutics layer:</strong></p><ol><li>Cellular & epigenetic reprogramming / rejuvenation</li><li>Senolytics and related therapeutics</li><li>Plasma, autophagy, and gene/RNA therapeutics</li></ol><p><strong>Measurement & infrastructure layer:</strong></p><ol><li>Early screening, imaging, and MCED</li><li>Biological age testing and biomarker platforms</li><li>Longevity drug-discovery platforms</li></ol><p><strong>Service & consumer layer:</strong></p><ol><li>Metabolic & hormone optimization clinics and platforms</li><li>Biological cryopreservation</li><li>Hyperbaric oxygen therapy (HBOT)</li><li>Virtual male hormone care</li></ol><p><strong>Cross-cutting:</strong> Primary care and community mental health (not a longevity category, but the 'current care backbone' all categories must integrate with for equity)</p>",notes:"This is a one-page reference for the nine-category framework. Users can flip back here for quick definitions."},{title:"14.2 Capital Allocation Quick Facts (2025–2026)",body:"<p><strong>By category:</strong><br>Therapeutics: $710.4M (59.3%) | Platforms: $307.3M (25.7%) | Consumer brands: $118.2M (9.8%) | Clinics: $42M (3.5%) | Diagnostics: $19.7M (1.6%)</p><p><strong>By stage:</strong><br>Seed: 6 deals, $52M (4.3%) | Series B: $456M (largest single-stage) | Series C+: $600M+ (epigenetic reprogramming Series C: $435M)</p><p><strong>By geography:</strong><br>North America: 91% ($1.09B) | Europe: <8% | Asia-Pacific: <1% | LMIC/LATAM/Africa: 0%</p><p><strong>Concentration:</strong> Top 1 deal = 36.3% of capital | Top 3 deals = 68% | Top 10 deals = 94.6%</p>",notes:"These are the key quantitative facts from Deck 2, condensed for reference."},{title:"14.3 Market Sizing by Category (2030 Projections)",body:"<p><strong>Therapeutics and drug discovery:</strong><br>Cellular/senolytics/plasma therapeutics: $30–50B | Drug-discovery platforms: $5–10B</p><p><strong>Screening and measurement:</strong><br>Early screening/MCED: High single-digit to low double-digit billions | Biomarkers: $2–5B | Longevity drug-discovery platforms: $5–10B</p><p><strong>Service and consumer:</strong><br>Metabolic/hormone platforms: Multi-billion segment | Cryo/HBOT: Sub-$1B to single-digit billions | Virtual male hormone care: Hundreds of millions to low single-digit billions</p><p><strong>Total addressable market (longevity-specific):</strong> ~$50–100B+ by 2030, depending on definitions and assumptions.</p><p><strong>For comparison:</strong> Addressable prevention and healthy-aging market (broader envelope) = $2–3 trillion by late 2020s.</p>",notes:"These 2030 bands are directional estimates, not forecasts. They show relative scale of different categories."},{title:"14.4 Integration Risk Framework (Summary)",body:"<p><strong>Five design principles to reduce integration risk:</strong></p><ol><li><strong>Indication selection:</strong> Primary-care-managed diseases, not speculative 'aging'</li><li><strong>Mental-health integration:</strong> Expectations management and adherence support built in</li><li><strong>Biomarker actionability:</strong> Diagnostics feed into clinical decision-making</li><li><strong>Primary-care workflow design:</strong> Built for time-poor clinicians, not ideal scenarios</li><li><strong>Equity from design:</strong> Diverse validation, cost models for low-income settings, measured equity outcomes</li></ol><p><strong>Companies following all five principles:</strong> More likely to have sustainable business models and broader reach.</p>",notes:"These five principles are actionable for founders and investors evaluating opportunities."},{title:"14.5 Failure Patterns Quick Checklist",body:"<p><strong>Red flags (common failure modes):</strong></p><ul><li>Ignoring adherence barriers or mental-health requirements</li><li>Overestimating willingness-to-pay for wealthy segments only</li><li>Operating in isolation from primary care</li><li>Building on weak or unvalidated evidence base</li><li>Overestimating addressable market size</li><li>No reimbursement pathway planned from day one</li><li>Biomarker validation not diverse or not causally linked to outcomes</li><li>Building for one geography (US/high-income) assuming global port</li><li>Heavy expectations-setting without mental-health support</li><li>Targeting underserved populations with premium-market products</li></ul><p><strong>If a company shows 3+ red flags:</strong> Integration risk is high. Exit or require substantial strategy shift.</p>",notes:"This is a quick checklist for investors doing due diligence. It's predictive of company failure or limited reach."},{title:"14.6 Key Definitions (Extended)",body:"<p><strong>Healthspan:</strong> Number of years of healthy, functional life (vs. lifespan, which is just years lived regardless of health).</p><p><strong>Geroscience:</strong> Biological study of aging processes; aging is understood as fundamental mechanism underlying multiple diseases.</p><p><strong>Senescence / senescent cells:</strong> State of cellular aging; cells stop dividing but don't die, secrete inflammatory factors (SASP).</p><p><strong>Epigenetic age / biological age:</strong> Estimate of cellular or organismal aging rate using measurable biomarkers (vs. chronological age).</p><p><strong>Primary care:</strong> First-contact, continuous, comprehensive, and coordinated care for the majority of a person's health needs.</p><p><strong>Underserved:</strong> Facing structural barriers to accessing timely, high-quality, culturally relevant health services (rural, low-income, fragile, stigmatized).</p>",notes:"These definitions are used consistently throughout the 6-deck suite. Users can reference here for clarity."},{title:"14.7 Suggested Reading and References",body:"<p><strong>Primary data sources:</strong></p><ul><li>New Market Pitch. 'Longevity Funding Analysis, July 2025–June 2026.'</li><li>MarketIntelo. 'Longevity Biotech Drug Market 2025–2034.'</li><li>Global Wellness Institute. 'Global Wellness Economy Monitor 2024.'</li></ul><p><strong>Key reports and frameworks:</strong></p><ul><li>Kaeberlein, M., & Kennedy, B.K. 'Hallmarks of Aging.' Cell, 2023. (Framework for aging biology)</li><li>World Health Organization. 'Integrated Care for Older People (ICOPE).' Guidelines on aging in primary care.</li><li>Lancet Commission on Healthy Ageing. (Policy framework for healthy aging globally)</li></ul><p><strong>Health equity frameworks:</strong></p><ul><li>Braveman, P., et al. 'Health Disparities and Health Equity.' JAMA, 2018.</li><li>Solar, O., & Irwin, A. 'A Conceptual Framework for Action on the Social Determinants of Health.' WHO, 2010.</li></ul>",notes:"These are starting references for users wanting to dig deeper into specific topics. Not an exhaustive bibliography, but key entry points."},{title:"End of Deck 6 & Full Suite",body:"<p style='font-size:20px;color:#999;margin-top:80px;'><strong>All six decks complete: 266 slides total.</strong></p><p>Deck 1: Executive Summary & Thesis (25 slides)<br>Deck 2: Market Size & Capital Flows (18 slides)<br>Deck 3A: Category Deep Dives – Therapeutics (68 slides)<br>Deck 3B: Category Deep Dives – Platforms & Services (54 slides)<br>Deck 4: Ecosystem & Failure Patterns (32 slides)<br>Deck 5: Playbooks & Integration (47 slides)<br>Deck 6: Methods & Appendix (22 slides)</p><p style='font-size:18px;color:#1e3c72;margin-top:30px;'>Thank you for reading. The longevity market is real, growing, and at a critical decision point. The choices founders, investors, and systems leaders make in 2026–2028 will determine whether longevity becomes a tool for broad health improvement or an elite niche. This suite is designed to support that choice-making.</p>",notes:"This concludes the full 6-deck suite. It provides: (1) context and thesis (Decks 1-2), (2) deep operational understanding of all 9 categories (Decks 3A-3B), (3) systems-level analysis and failure patterns (Deck 4), (4) actionable playbooks for founders and investors (Deck 5), and (5) methodological transparency (Deck 6). Together, the decks tell a coherent story about the longevity market, its opportunities, constraints, and paths to impact."}];let currentSlide=0;let showNotes=true;function renderSlide(index){const container=document.getElementById('slidesContainer');const slide=slides[index];let html=`<div class="slide-container"><h2 class="slide-title">${slide.title}</h2><div class="slide-body">${slide.body}</div>${slide.notes?`<div class="speaker-notes ${showNotes?'visible':''}"><h4>Speaker Notes</h4><p>${slide.notes}</p></div>`:''}</div>`;container.innerHTML=html;updateNavigation();updateProgress();}function updateNavigation(){document.getElementById('prevBtn').disabled=currentSlide===0;document.getElementById('nextBtn').disabled=currentSlide===slides.length-1;document.getElementById('slideNumber').textContent=currentSlide+1;document.getElementById('totalSlides').textContent=slides.length;document.getElementById('progressText').textContent=`Slide ${currentSlide+1} of ${slides.length}`;}function updateProgress(){const progress=((currentSlide+1)/slides.length)*100;document.getElementById('progressFill').style.width=progress+'%';}function nextSlide(){if(currentSlide<slides.length-1){currentSlide++;renderSlide(currentSlide);window.scrollTo(0,0);}}function previousSlide(){if(currentSlide>0){currentSlide--;renderSlide(currentSlide);window.scrollTo(0,0);}}document.getElementById('toggleNotes').addEventListener('click',function(){showNotes=!showNotes;document.querySelectorAll('.speaker-notes').forEach(note=>{if(showNotes){note.classList.add('visible');}else{note.classList.remove('visible');}});this.classList.toggle('active');});document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')nextSlide();if(e.key==='ArrowLeft')previousSlide();});renderSlide(0);</script></body></html>
